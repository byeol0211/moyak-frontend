name: moyak
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  camera: ^0.12.1
  cupertino_icons: ^2.0.0
  daily_flutter: ^0.41.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  geolocator: ^14.1.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  kakao_map_plugin: ^1.0.0
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/figma/

# 앱 아이콘: assets/icon/M.png 한 장으로 각 플랫폼 아이콘을 만든다.
# 이미지를 바꾼 뒤 `dart run flutter_launcher_icons`를 다시 실행하세요.
flutter_launcher_icons:
  image_path: assets/icon/M.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFD54F"
    theme_color: "#FFD54F"
